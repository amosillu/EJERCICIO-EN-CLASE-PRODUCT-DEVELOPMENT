[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ejercicio_clases"
version = "0.0.1"
description = "Ejercicio en clases - Product Development"
authors = [
  { name = "Amos Illu" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["ejercicio_clases"]
include = ["pyproject.toml", "ejercicio_clases/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ejercicio_clases"]
force-sort-within-sections = true

